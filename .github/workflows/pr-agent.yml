name: PR Agent Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Manual /review is restricted to trusted repo actors on open PRs only.
    # Public comment spam must not burn DeepSeek quota.
    if: >
      github.event.sender.type != 'Bot' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/review')
        )
      )
    runs-on: ubuntu-latest
    name: Review pull request with OpenCode Go (DeepSeek V4.1 Flash)

    steps:
      - name: Run PR-Agent
        # Pin to the immutable commit for tag v0.41.1.
        uses: the-pr-agent/pr-agent@743f52d80f3513193dfc7626f778c73478df6d0a # v0.41.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenCode Go's OpenAI-compatible Chat Completions API via LiteLLM.
          # Secret: Settings > Secrets and variables > Actions > OPENCODE_GO_API_KEY
          OPENAI.KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENAI.API_BASE: "https://opencode.ai/zen/go/v1"
          # OpenCode Go asks coding agents to identify themselves and send a stable
          # session ID. A workflow run is one review conversation.
          LITELLM.EXTRA_HEADERS: >-
            {"User-Agent":"renpy-translation-lab-pr-agent/1.0","x-opencode-session":"renpy-translation-lab-${{ github.repository_id }}-${{ github.run_id }}"}

          # PR-Agent loads .pr_agent.toml from the default branch first.
          # Keep model/language knobs in workflow env so feature-branch PRs
          # still route DeepSeek V4.1 Flash through OpenCode Go before merge.
          config.model: "openai/deepseek-v4.1-flash"
          config.fallback_models: '["openai/deepseek-v4.1-flash"]'
          config.response_language: "zh-CN"
          config.restricted_mode: "true"
          config.repo_context_files: '["AGENTS.md"]'
          config.repo_context_from_default_branch: "true"
          config.max_model_tokens: "32000"
          config.ai_timeout: "180"
          config.verbosity_level: "1"

          pr_reviewer.num_max_findings: "5"
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.persistent_comment: "true"
          pr_reviewer.extra_instructions: >-
            你在审查 renpy-translation-lab。优先找真实回归和合约破坏，不要给空泛风格建议。
            重点检查：CLI/GUI/配置/文案/测试同步；Batch check->apply 合约；
            Windows 路径兼容；不要引入密钥/私有脚本/logs；不要手改 requirements-lock。
            使用中文；只报告高价值问题；明确区分 blocker 与 nit。

          # Only auto-review for now; describe/improve stay off to reduce noise.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          # Re-review when new commits land on the PR.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
